<div class="blade-content __medium-wide">
  <div class="blade-inner">
    <div class="inner-block">
      <form class="form" name="detailForm">
        <va-metaform registered-inputs="blade.metaFields"
                     blade="blade"
                     column-count="6"
                     ng-if="blade.currentEntity">
        </va-metaform>

        <va-metaform registered-inputs="blade.metaFields1"
                     blade="blade"
                     column-count="6"
                     ng-if="blade.currentEntity"
                     class="blade-gray-box">
        </va-metaform>

        <va-metaform registered-inputs="blade.metaFields2"
                     blade="blade"
                     column-count="6"
                     ng-if="blade.currentEntity">
        </va-metaform>
      </form>
    </div>
  </div>
</div>

<script type="text/ng-template" id="product-details-is-active-readonly.html">
  <div class="form-input">
    <label class="form-label __switch">
      <input type="checkbox" ng-model="blade.currentEntity.isActive" disabled="disabled">
      <span class="switch disabled"></span>
    </label>
  </div>

  <div class="form-error" ng-if="!blade.currentEntity.parentCategoryIsActive">
    <div class="vc-alert vc-alert--warning">
      <svg class="vc-alert__icon">
        <use href="/images/error.svg#icon"></use>
      </svg>
      <div class="vc-alert__text">{{ 'catalog.blades.category-detail.parent-disabled-alert' | translate }}</div>
    </div>
  </div>
</script>

<script type="text/ng-template" id="name-readonly.html">
  <div class="form-input">
    <textarea class="__xsmall"
              cols="30"
              rows="1"
              ng-model="blade.item.name"
              readonly="readonly"
              disabled
              placeholder="{{ 'catalog.blades.item-detail.placeholders.name' | translate }}">
        </textarea>
  </div>
</script>

<script type="text/ng-template" id="localizedName-readonly.html">
  <div class="vc-catalog form-input __langs"
       ng-repeat="language in blade.catalog.languages | limitTo: blade.showAllLanguages ? blade.catalog.languages.length : 2">
    <label class="lang-code">{{language.languageCode}}</label>
    <input ng-model="blade.currentEntity.localizedName.values[language.languageCode]"
           type="text"
           readonly="readonly"
           placeholder="{{ 'catalog.blades.item-detail.placeholders.name' | translate }}" />
  </div>

  <div ng-if="blade.catalog.languages.length > 2">
    <a href="" ng-click="blade.showAllLanguages = !blade.showAllLanguages">
      {{ (blade.showAllLanguages ? 'catalog.blades.item-detail.labels.show-less-languages' : 'catalog.blades.item-detail.labels.show-more-languages' ) | translate }}
    </a>
  </div>
</script>

<script type="text/ng-template" id="sku-readonly.html">
  <div class="form-input">
    <input class="form-control"
           ng-model="blade.item.code"
           name="code"
           readonly="readonly"
           placeholder="{{ 'catalog.blades.item-detail.placeholders.sku' | translate }}" />
  </div>
</script>

<script type="text/ng-template" id="gtin-readonly.html">
  <div class="form-input">
    <input class="form-control"
           ng-model="blade.item.gtin"
           name="gtin"
           type="text"
           readonly="readonly"
           placeholder="{{ 'catalog.blades.item-detail.placeholders.gtin' | translate }}" />
  </div>
</script>

<script type="text/ng-template" id="mpn-readonly.html">
  <div class="form-input">
    <input class="form-control"
           ng-model="blade.item.manufacturerPartNumber"
           name="manufacturerPartNumber"
           type="text"
           readonly="readonly"
           placeholder="{{ 'catalog.blades.item-detail.placeholders.mpn' | translate }}" />
  </div>
</script>

<script type="text/ng-template" id="startDate-readonly.html">
  <div class="form-input __calendar">
    <input ng-model="blade.item.startDate"
           readonly="readonly"
           placeholder="{{ 'catalog.blades.item-detail.placeholders.start-date' | translate }}" />
    <button class="btn" type="button" disabled="disabled">
      <i class="btn-ico fa fa-calendar"></i>
    </button>
  </div>
</script>

<script type="text/ng-template" id="endDate-readonly.html">
  <div class="form-input __calendar">
    <input ng-model="blade.item.endDate"
           readonly="readonly"
           placeholder="{{ 'catalog.blades.item-detail.placeholders.end-date' | translate }}" />
    <button class="btn" type="button" disabled="disabled">
      <i class="btn-ico fa fa-calendar"></i>
    </button>
  </div>
</script>

<script type="text/ng-template" id="downloadType-readonly.html">
  <div class="form-input">
    <input class="form-control"
           ng-model="blade.item.downloadType"
           readonly="readonly"
           placeholder="{{ 'catalog.blades.item-detail.placeholders.download-type' | translate }}" />
  </div>
</script>

<script type="text/ng-template" id="vendor-readonly.html">
  <div class="form-group">
    <label class="form-label">{{ 'catalog.blades.item-detail.labels.vendor' | translate }}</label>
    <div class="form-input">
      <input class="form-control"
             ng-value="blade.item.vendor && blade.item.vendor.name ? blade.item.vendor.name : blade.item.vendor"
             readonly="readonly"
             placeholder="{{ 'catalog.blades.item-detail.placeholders.vendor' | translate }}" />
    </div>
  </div>
</script>

<script type="text/ng-template" id="taxType-readonly.html">
  <div class="form-group">
    <label class="form-label">{{ 'catalog.blades.item-detail.labels.tax-type' | translate }}</label>
    <div class="form-input">
      <input class="form-control"
             ng-model="blade.item.taxType"
             readonly="readonly"
             placeholder="{{ 'catalog.blades.item-detail.placeholders.tax-type' | translate }}" />
    </div>
  </div>
</script>
